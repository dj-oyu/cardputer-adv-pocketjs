name: Function allocation leaf
on:
  pull_request:
    paths:
      - 'components/quickjs-ng/quickjs-ng/**'
      - 'tools/vmtest/function_allocation/**'
      - '.github/workflows/function-allocation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: function-allocation-${{ github.ref }}
  cancel-in-progress: true
env:
  LEAF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  allocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [native, m32]
        variant: [o2, asan]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.LEAF_HEAD }}
          persist-credentials: false
      - name: Record exact source head
        run: |
          mkdir -p .cache/function_allocation/evidence
          git rev-parse HEAD | tee .cache/function_allocation/evidence/head.txt
          test "$(git rev-parse HEAD)" = "$LEAF_HEAD"
      - name: Full baseline, candidate and poisoned corpus with OOM sweeps
        run: |
          args=()
          if [ '${{ matrix.arch }}' = m32 ]; then args+=(--m32); fi
          python3 tools/vmtest/function_allocation/run.py "${args[@]}" --variant '${{ matrix.variant }}' --oom
          if [ '${{ matrix.variant }}' = o2 ]; then
            python3 tools/vmtest/function_allocation/run.py "${args[@]}" --variant o2 --only poison --negative
            python3 tools/vmtest/function_allocation/run.py "${args[@]}" --variant o2 --only poison --negative-copy
          fi
          if [ '${{ matrix.arch }}' = native ] && [ '${{ matrix.variant }}' = asan ]; then
            export VMTEST_OUT="$PWD/.cache/function_allocation/reloc"
            bash tools/vmtest/build.sh asan-reloc > .cache/function_allocation/evidence/reloc-build.log 2>&1
            VMTEST_VMRUN_FLAGS=--force-reloc bash tools/vmtest/run.sh --variant asan-reloc > .cache/function_allocation/evidence/reloc-corpus.log 2>&1
          fi
          if [ '${{ matrix.arch }}' = native ] && [ '${{ matrix.variant }}' = o2 ]; then
            VMTEST_OUT="$PWD/.cache/function_allocation/native-candidate-debug-o2" bash tools/vmtest/budget_probe.sh o2 > .cache/function_allocation/evidence/native-budget.log 2>&1
          fi
          if [ '${{ matrix.arch }}' = native ] && [ '${{ matrix.variant }}' = o2 ]; then
            bash tools/vmtest/floor/gen_rom_intrinsics.sh --check > .cache/function_allocation/evidence/rom-generator.log 2>&1
            gcc -O1 -g -Wall -Werror -fsanitize=address,undefined -I components/quickjs-ng/quickjs-ng tools/vmtest/test_dbuf_sticky.c -o .cache/function_allocation/dbuf-sticky
            .cache/function_allocation/dbuf-sticky > .cache/function_allocation/evidence/dbuf-sticky.log
          fi
          if [ '${{ matrix.arch }}' = native ] && [ '${{ matrix.variant }}' = asan ]; then
            bash tools/vmtest/oom_targets.sh > .cache/function_allocation/evidence/oom-targets.log 2>&1
          fi
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: function-allocation-${{ matrix.arch }}-${{ matrix.variant }}-${{ env.LEAF_HEAD }}
          path: .cache/function_allocation/evidence/
          retention-days: 14
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [o2, asan]
        rom: ['', '--rom']
        debug: ['', '--strip']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.LEAF_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the existing corpus with untouched main including ROM builtins
        run: |
          test "$(git rev-parse HEAD)" = "$LEAF_HEAD"
          python3 tools/vmtest/function_allocation/compare_main.py --variant '${{ matrix.variant }}' ${{ matrix.rom }} ${{ matrix.debug }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: function-compat-${{ strategy.job-index }}-${{ env.LEAF_HEAD }}
          path: .cache/function_allocation/evidence/
          retention-days: 14
