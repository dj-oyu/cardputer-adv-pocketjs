name: Source submodule contract
on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'third_party/**'
      - 'components/minimp3/**'
      - 'components/opus/**'
      - 'main/CMakeLists.txt'
      - 'tools/prepare*'
      - 'tools/test_minimp3_submodule.py'
      - 'tools/test_broker_source_submodules.py'
      - '.github/workflows/minimp3-submodule.yml'
  push:
    branches: [main]
    paths:
      - '.gitmodules'
      - 'third_party/**'
      - 'components/minimp3/**'
      - 'components/opus/**'
permissions:
  contents: read
# New pushes replace a PR's older run; main runs finish so their caches are saved.
concurrency:
  group: minimp3-submodule-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Compile initialized sources and reject missing dependencies without SDK or device
        run: python3 tools/test_minimp3_submodule.py
      - name: Read the reviewed broker importer at its reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dj-oyu/esp-device-broker-mcp
          ref: af05f1e663cdab572ed0161e43e72f23c6ba3d88
          path: .reference/broker
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Install the broker's locked dependencies without SDK or device
        working-directory: .reference/broker
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          python -m pip install --disable-pip-version-check --no-deps uv==0.12.19
          uv sync --frozen --no-install-project --python python
      - name: Acquire all public fixed sources through the reviewed broker importer
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: .reference/broker/src
        run: .reference/broker/.venv/bin/python tools/test_broker_source_submodules.py
