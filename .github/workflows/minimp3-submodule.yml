name: Source submodule contract
on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'third_party/**'
      - 'components/minimp3/**'
      - 'components/opus/**'
      - 'main/CMakeLists.txt'
      - 'tools/prepare*'
      - 'tools/test_minimp3_submodule.py'
      - '.github/workflows/minimp3-submodule.yml'
  push:
    branches: [main]
    paths:
      - '.gitmodules'
      - 'third_party/**'
      - 'components/minimp3/**'
      - 'components/opus/**'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - name: Compile initialized sources and reject missing dependencies without SDK or device
        run: python3 tools/test_minimp3_submodule.py
