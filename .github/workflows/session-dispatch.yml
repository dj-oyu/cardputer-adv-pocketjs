name: Session dispatch host checks
on:
  pull_request:
    paths:
      - 'main/app_session.c'
      - 'main/hal/board.c'
      - 'main/hal/board.h'
      - 'tools/test_session_dispatch.c'
      - 'tools/test_session_dispatch.py'
      - 'tools/test_session_query_headers.py'
      - 'main/hal/sound*.h'
      - 'main/hal/ima_adpcm.h'
      - 'main/pocket/pocket_pixel.h'
      - 'main/pocket/pocket_grid.h'
      - 'main/pocket/pocket_video.h'
      - 'main/ui/kasane/*.h'
      - 'components/quickjs-ng/quickjs-ng/*.h'
      - '.github/workflows/session-dispatch.yml'
permissions:
  contents: read
# New pushes replace a PR's older run; main runs finish so their caches are saved.
concurrency:
  group: session-dispatch-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Actual session functions with synthetic ports, sanitizers and optimized build
        run: python3 tools/test_session_dispatch.py
      - name: Session query declarations across display configurations
        run: python3 tools/test_session_query_headers.py
