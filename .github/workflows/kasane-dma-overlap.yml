name: Kasane copied DMA overlap
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kasane-dma-${{ github.ref }}
  cancel-in-progress: true
env:
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_HEAD }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Actual board and renderer boundaries with delayed completion and faults
        run: |
          python3 tools/test_board_present_sync.py
          python3 tools/test_board_dma_overlap.py
          python3 tools/test_kasane_dma_overlap.py
          python3 tools/test_dma_completion_owners.py
          python3 tools/test_dma_measurement.py
          python3 tools/test_dma_diagnostic_build.py
      - name: Existing renderer and owner contracts
        shell: bash
        run: |
          set -euo pipefail
          for options in '-O2 -fstrict-aliasing' '-g -fsanitize=address,undefined'; do
            for test in render view runtime app_teardown repair; do
              cc -std=c11 -Wall -Wextra -Werror $options -Imain/ui/kasane -Itools/kasane_contract \
                main/ui/kasane/ksn_core.c main/ui/kasane/ksn_render.c main/ui/kasane/ksn_blend_pie.c \
                main/ui/kasane/ksn_cache.c main/ui/kasane/ksn_modal.c main/ui/kasane/ksn_view.c \
                tools/kasane_contract/test_$test.c -lm -o /tmp/dma-contract
              /tmp/dma-contract
            done
          done
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        overlap: ['OFF', 'ON']
        detail: ['OFF', 'ON']
    container:
      image: espressif/idf:v6.0.1
      options: --user 1001:1001
    env:
      IDF_COMPONENT_MANAGER: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_HEAD }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Compile and link independent DMA switch
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          test "$(idf.py --version)" = 'ESP-IDF v6.0.1'
          idf.py -B build_dma -D SDKCONFIG="$PWD/build_dma/sdkconfig" -D IDF_TARGET=esp32s3 -D PROJECT_VER="${SOURCE_HEAD:0:12}" -D KASANE_DMA_OVERLAP=${{ matrix.overlap }} -D POCKET_DERBY_DETAIL_MEASURE=${{ matrix.detail }} build
          python -B tools/record_verification.py --build build_dma --expect-telemetry ON --expect-measure ON --out build_dma/verification.json
          python -B - '${{ matrix.overlap }}' '${{ matrix.detail }}' <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from record_verification import detail_mode, elf_symbols
          build = Path('build_dma')
          overlap, detail = sys.argv[1:]
          cache = (build / 'CMakeCache.txt').read_bytes()
          selected = [line.split('=', 1)[1] for line in cache.decode().splitlines()
                      if line.startswith('KASANE_DMA_OVERLAP:BOOL=')]
          assert selected == [overlap], 'DMA cache/selection mismatch'
          assert detail_mode(build) == detail, 'detail cache/selection mismatch'
          required = {'board_present_submit', 'board_present_finish'}
          linked = required & elf_symbols(build)
          assert linked == (required if overlap == 'ON' else set()), 'DMA linked mode mismatch'
          images = {}
          for suffix in ('bin', 'elf'):
              path = build / ('cardputer_pocketjs.' + suffix)
              data = path.read_bytes()
              images[suffix] = dict(bytes=len(data), sha256=hashlib.sha256(data).hexdigest())
          proof = dict(schema_version=1, source_head=subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True).strip(), dma_mode=overlap,
              detail_mode=detail, linked_dma_symbols=sorted(linked),
              cmake_cache_sha256=hashlib.sha256(cache).hexdigest(), images=images)
          (build / 'dma-mode-proof.json').write_text(json.dumps(proof, indent=2) + '\n')
          print(json.dumps(proof))
          PY
          python -B tools/report_derby_fixed_stack.py --build build_dma
          python -B tools/report_derby_detail_resources.py --build build_dma
          idf.py -B build_dma size-files > build_dma/size-files.txt
          idf.py -B build_dma size > build_dma/size.txt
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kasane-dma-${{ matrix.overlap }}-detail-${{ matrix.detail }}-${{ env.SOURCE_HEAD }}
          path: |
            build_dma/*.json
            build_dma/esp-idf/main/**/*.su
            build_dma/*.elf
            build_dma/*.map
            build_dma/*.bin
            build_dma/sdkconfig
            build_dma/size-files.txt
            build_dma/size.txt
            build_dma/SHA256SUMS
            build_dma/CMakeCache.txt
            build_dma/log/
          retention-days: 14
