name: BIG WAVE curl section
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, m32]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5bf332368d6e793cd40a8a18a48b4da4ac270622
          path: tools-source
          persist-credentials: false
      - name: Install 32-bit compiler libraries
        if: matrix.arch == 'm32'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Sanitizers and finite diagnostic parity
        if: matrix.arch == 'x64'
        run: |
          python3 -B tools/games/run_bigwave_curl.py --sanitize --verify-only --out .cache/curl-asan
          python3 -B tools/games/test_bigwave_curl_diag.py --common tools-source/tools/games/prepare_derby_app_diag.py --out .cache/curl-diag
      - name: Full app and paired timing (64-bit model)
        if: matrix.arch == 'x64'
        run: python3 -B tools/games/run_bigwave_curl.py --pairs 15 --out .cache/curl-x64
      - name: Device-sized values and product heap limit
        if: matrix.arch == 'm32'
        env:
          M32_CFLAGS: -m32 -malign-double
        run: python3 -B tools/games/run_bigwave_curl.py --m32 --heap-limit 163840 --pairs 15 --out .cache/curl-m32
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bigwave-curl-section-host-${{ matrix.arch }}-${{ env.SOURCE_HEAD }}
          include-hidden-files: true
          path: |
            .cache/curl-*/result.json
            .cache/curl-*/boundary-result.json
            .cache/curl-*/*.log
            .cache/curl-*/*.csv
            .cache/curl-*/harness.c
            .cache/curl-*/build-flags.json
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [base, changed]
        profile: [product, title]
    container:
      image: espressif/idf:v6.0.1
      options: --user 1001:1001
    env:
      IDF_COMPONENT_MANAGER: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5bf332368d6e793cd40a8a18a48b4da4ac270622
          path: tools-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.mode == 'base' && 'e0fe98a8c2a3de3b48c8d547c1ff3c8d99863267' || env.SOURCE_HEAD }}
          path: diagnostic-source
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_HEAD }}
          path: candidate-tools
          persist-credentials: false
      - name: Prepare finite diagnostic in disposable checkout
        if: matrix.profile == 'title'
        run: python3 -B candidate-tools/tools/games/prepare_bigwave_curl_diag.py --common tools-source/tools/games/prepare_derby_app_diag.py --checkout diagnostic-source
      - name: Build with product settings and partition
        working-directory: diagnostic-source
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          test "$(idf.py --version)" = 'ESP-IDF v6.0.1'
          idf.py -B build_diag -D SDKCONFIG=build_diag/sdkconfig build
          git rev-parse HEAD > build_diag/source-head.txt
          grep -qx 'CONFIG_LOG_DEFAULT_LEVEL_INFO=y' build_diag/sdkconfig
          grep -qx 'POCKET_DERBY_COURSE_CACHE:BOOL=OFF' build_diag/CMakeCache.txt
          grep -qx 'POCKET_DERBY_PROJECT_BATCH:BOOL=OFF' build_diag/CMakeCache.txt
          python "$IDF_PATH/components/partition_table/gen_esp32part.py" -q --offset 0x8000 --flash-size 8MB partitions.csv build_diag/expected-partition.bin
          cmp build_diag/expected-partition.bin build_diag/partition_table/partition-table.bin
          python -c 'from pathlib import Path; e=Path("build_diag/cardputer_pocketjs.elf").read_bytes(); assert b"Application information:" in e; c=Path("build_diag/sdkconfig").read_text(); assert not any(k+"=y" in c for k in ("CONFIG_SECURE_BOOT", "CONFIG_SECURE_BOOT_V2_ENABLED", "CONFIG_SECURE_FLASH_ENC_ENABLED", "CONFIG_BOOTLOADER_APP_ANTI_ROLLBACK"))'
          if test -f diagnostic.json; then cp diagnostic.json diagnostic.patch build_diag/; fi
          sha256sum build_diag/cardputer_pocketjs.bin build_diag/cardputer_pocketjs.elf build_diag/bootloader/bootloader.bin build_diag/partition_table/partition-table.bin > build_diag/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bigwave-curl-section-${{ matrix.mode }}-${{ matrix.profile }}-${{ env.SOURCE_HEAD }}
          path: |
            diagnostic-source/build_diag/cardputer_pocketjs.bin
            diagnostic-source/build_diag/cardputer_pocketjs.elf
            diagnostic-source/build_diag/cardputer_pocketjs.map
            diagnostic-source/build_diag/bootloader/bootloader.bin
            diagnostic-source/build_diag/partition_table/partition-table.bin
            diagnostic-source/build_diag/ota_data_initial.bin
            diagnostic-source/build_diag/flasher_args.json
            diagnostic-source/build_diag/flash_args
            diagnostic-source/build_diag/sdkconfig
            diagnostic-source/build_diag/CMakeCache.txt
            diagnostic-source/build_diag/source-head.txt
            diagnostic-source/build_diag/diagnostic.json
            diagnostic-source/build_diag/diagnostic.patch
            diagnostic-source/build_diag/SHA256SUMS
