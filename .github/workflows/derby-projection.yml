name: DERBY course cache and projection comparison
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: derby-projection-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One runner per tier (and one for the cost run): each runner has 4 cores and
    # the tier trials already fill them, so splitting across runners is what
    # shortens the wall time.
    strategy:
      fail-fast: false
      matrix:
        part:
          - {name: tier0, args: --tier 0, out: projection}
          - {name: tier1, args: --tier 1, out: projection}
          - {name: tier2, args: --tier 2, out: projection}
          - {name: cost, args: --benchmark-only, out: projection-cost}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run ${{ matrix.part.name }}
        shell: bash
        env:
          PART: ${{ matrix.part.name }}
          ARGS: ${{ matrix.part.args }}
          OUT: artifacts/${{ matrix.part.out }}
        run: |
          set -euo pipefail
          runner=tools/games/run_derby_projection.py
          # A PR head that predates --tier runs every tier in the tier1 cell.
          if [ "$PART" != cost ] && ! grep -q -- "'--tier'" "$runner"; then
            if [ "$PART" != tier1 ]; then echo "runner has no --tier; tier1 cell runs all tiers"; exit 0; fi
            ARGS=--all-tiers
          fi
          python -B "$runner" $ARGS --out "$OUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: derby-projection-host-${{ matrix.part.name }}-${{ env.SOURCE_HEAD }}
          path: |
            artifacts/projection/result.json
            artifacts/projection/**/*.log
            artifacts/projection/**/*.csv
            artifacts/projection-cost/result.json
            artifacts/projection-cost/**/*.log
          retention-days: 14
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cache: ['OFF','ON']
        batch: ['OFF','ON']
    container:
      image: espressif/idf:v6.0.1
      options: --user 1001:1001
    env:
      IDF_COMPONENT_MANAGER: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          path: ci-actions
          persist-credentials: false
      - uses: ./ci-actions/.github/actions/idf-ccache
        with:
          matrix: ${{ toJSON(matrix) }}
      - name: Build exact source with independent comparison switches
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          test "$(idf.py --version)" = 'ESP-IDF v6.0.1'
          idf.py -B build_projection -DPOCKET_DERBY_COURSE_CACHE=${{ matrix.cache }} -DPOCKET_DERBY_PROJECT_BATCH=${{ matrix.batch }} -D KASANE_MEGADEMO_TRACE=OFF build
          ccache -s || true
          grep -qx 'POCKET_DERBY_COURSE_CACHE:BOOL=${{ matrix.cache }}' build_projection/CMakeCache.txt
          grep -qx 'POCKET_DERBY_PROJECT_BATCH:BOOL=${{ matrix.batch }}' build_projection/CMakeCache.txt
          grep -qx 'POCKET_DERBY_RUNNER_AFFINE:BOOL=OFF' build_projection/CMakeCache.txt
          grep -qx 'POCKET_DERBY_RUNNER_AFFINE_PIE_MIN:STRING=0' build_projection/CMakeCache.txt
          if [ '${{ matrix.cache }}' = OFF ] && [ '${{ matrix.batch }}' = OFF ]; then
            xtensa-esp-elf-nm -a build_projection/cardputer_pocketjs.elf > build_projection/symbols.txt
            if grep -E ' (derby_runner_affine|js_project|course_pose|pocket_derby_projection_counts)$' build_projection/symbols.txt; then exit 1; fi
            test ! -e build_projection/generated/derby_project_batch
          fi
          sha256sum build_projection/cardputer_pocketjs.bin build_projection/cardputer_pocketjs.elf > build_projection/SHA256SUMS
          python -c 'from pathlib import Path; paths=sorted(Path("build_projection").rglob("*pocket_derby*.su")); Path("build_projection/projection-stack.txt").write_text("\n".join(str(p)+"\n"+p.read_text() for p in paths))'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: derby-projection-${{ env.SOURCE_HEAD }}-cache-${{ matrix.cache }}-batch-${{ matrix.batch }}
          path: |
            build_projection/cardputer_pocketjs.bin
            build_projection/cardputer_pocketjs.elf
            build_projection/cardputer_pocketjs.map
            build_projection/CMakeCache.txt
            build_projection/SHA256SUMS
            build_projection/projection-stack.txt
            build_projection/symbols.txt
          retention-days: 14
