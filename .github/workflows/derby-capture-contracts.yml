name: DERBY J1 DMA integration full contracts
on:
  # PR merge-ref caches cannot seed sibling PRs. Normal approved base updates
  # run this same complete suite and save objects in an inheritable base scope.
  push:
    branches:
      - main
      - integration/derby-j1-dma-host-r2-20261020
  pull_request:
    paths:
      - '.github/workflows/derby-capture-contracts.yml'
      # Native guest-cache pressure policy and its direct host contracts.
      - 'components/pocketjs_guest/include/pocketjs/block_cache.h'
      - 'components/pocketjs_guest/include/pocketjs/guest.h'
      - 'components/pocketjs_guest/src/block_cache.c'
      - 'components/pocketjs_guest/src/guest.c'
      - 'main/app_session.c'
      - 'main/pocket/pocket_memory.c'
      - 'main/pocket/pocket_memory.h'
      # Procedural workspace ownership and its real-QuickJS contracts.
      - 'main/pocket/pocket_proc.c'
      - 'tools/kasane_contract/test_pocket_proc*.c'
      - 'tools/kasane_contract/run_pocket_proc*.py'
      - 'tools/vmtest/prepare/**'
      - 'tools/build_memory_test.sh'
      - 'tools/test_block_cache.c'
      - 'tools/test_pocket_memory.c'
      - 'tools/test_guest_cache_pressure.py'
      - 'tools/test_derby_fixed_integration.py'
      - 'tools/kasane_ir/check_equivalence.py'
      - 'tools/kasane_ir/test_check_equivalence.py'
      - 'tools/kasane_contract/run.sh'
      - 'tools/host_build.py'
      - 'tools/test_host_build.py'
      - 'tools/build_kasane_test.sh'
      - 'tools/kasane_contract/run_qjs_utf8_cost.sh'
      - 'tools/games/run_derby.py'
      - 'tools/games/run_big_wave.py'
      - 'tools/kasane_contract/run_megademo_app_host.py'
      - 'tools/games/verify_derby_recorded_trial.py'
      - 'tools/games/derby_manifest_export.py'
      - 'tools/test_derby_manifest_export.py'
      - 'tools/games/verify_derby_dma_consumer.py'
      - 'tools/test_derby_mcp59_composition.py'
      - 'tools/verify_dma_diagnostic_build.py'
      - '.github/workflows/kasane-dma-overlap.yml'
  workflow_dispatch:
permissions:
  contents: read
# Keep base push and PR refs separate: a PR update must not cancel base seeding.
concurrency:
  group: derby-capture-${{ github.ref }}
  cancel-in-progress: true
env:
  HARNESS_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  full:
    name: full (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: j1-baseline
            source: b561aea1c0798feb28055a00d36681fae81ac58a
          - name: j1-dma-combined
            source: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.HARNESS_HEAD }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.source || env.HARNESS_HEAD }}
          path: source
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply only the common test overlay and record its source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/artifacts
          git -C source rev-parse HEAD > source/artifacts/source-head.txt
          git -C harness rev-parse HEAD > source/artifacts/harness-head.txt
          for path in tools/kasane_ir/check_equivalence.py tools/kasane_ir/test_check_equivalence.py tools/kasane_contract/run.sh tools/host_build.py tools/test_host_build.py tools/build_kasane_test.sh tools/kasane_contract/run_qjs_utf8_cost.sh tools/games/run_derby.py tools/games/run_big_wave.py tools/kasane_contract/run_megademo_app_host.py; do
            mkdir -p "source/$(dirname "$path")"
            cp "harness/$path" "source/$path"
          done
          mkdir -p source/tools/vmtest
          cp -R harness/tools/vmtest/prepare source/tools/vmtest/
          git -C source add -- tools/kasane_ir/check_equivalence.py tools/kasane_ir/test_check_equivalence.py tools/kasane_contract/run.sh tools/host_build.py tools/test_host_build.py tools/build_kasane_test.sh tools/kasane_contract/run_qjs_utf8_cost.sh tools/games/run_derby.py tools/games/run_big_wave.py tools/kasane_contract/run_megademo_app_host.py tools/vmtest/prepare
          git -C source diff --cached > source/artifacts/test-overlay.patch
          git -C source write-tree > source/artifacts/overlay-tree.txt
          if [ '${{ matrix.name }}' != j1-baseline ]; then
            test "$(git -C source rev-parse 'HEAD^{tree}')" = "$(cat source/artifacts/overlay-tree.txt)"
          fi
          (cd source && sha256sum tools/kasane_ir/check_equivalence.py tools/kasane_ir/test_check_equivalence.py tools/kasane_contract/run.sh tools/host_build.py tools/test_host_build.py tools/build_kasane_test.sh tools/kasane_contract/run_qjs_utf8_cost.sh tools/games/run_derby.py tools/games/run_big_wave.py tools/kasane_contract/run_megademo_app_host.py) > source/artifacts/test-overlay.sha256
          (cd source && git ls-files -z tools/vmtest/prepare | xargs -0 sha256sum) >> source/artifacts/test-overlay.sha256
          git -C source diff HEAD --exit-code -- . ':!tools/kasane_ir/check_equivalence.py' ':!tools/kasane_ir/test_check_equivalence.py' ':!tools/kasane_contract/run.sh' ':!tools/host_build.py' ':!tools/test_host_build.py' ':!tools/build_kasane_test.sh' ':!tools/kasane_contract/run_qjs_utf8_cost.sh' ':!tools/games/run_derby.py' ':!tools/games/run_big_wave.py' ':!tools/kasane_contract/run_megademo_app_host.py' ':!tools/vmtest/prepare'
      # Only compiler objects and dependency metadata; never fixtures, executables,
      # test results, firmware images, or source/tree verification artifacts.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: source/.cache/host-objects-v1
          key: host-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ hashFiles('harness/tools/host_build.py') }}-${{ env.HARNESS_HEAD }}
          restore-keys: |
            host-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ hashFiles('harness/tools/host_build.py') }}-
      - name: Verify dependency-aware host compiler reuse
        working-directory: source
        run: python -B tools/test_host_build.py
      - name: Prepare official 32-bit dependencies
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          M32_SYSROOT="$PWD/.cache/kasane_megademo_app/m32sys" \
            bash tools/vmtest/m32_sysroot.sh > artifacts/m32-flags.txt 2> artifacts/m32-prepare.log
      - name: Run the complete contract script including capture and m32 games
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if ! CONTRACT_LOG_DIR=artifacts/contract-sections GAMES_M32=1 bash tools/kasane_contract/run.sh > artifacts/full-contracts.log 2>&1; then
            tail -n 120 artifacts/full-contracts.log
            exit 1
          fi
          sha256sum --check artifacts/test-overlay.sha256
          git diff HEAD --exit-code -- . ':!tools/kasane_ir/check_equivalence.py' ':!tools/kasane_ir/test_check_equivalence.py' ':!tools/kasane_contract/run.sh' ':!tools/host_build.py' ':!tools/test_host_build.py' ':!tools/build_kasane_test.sh' ':!tools/kasane_contract/run_qjs_utf8_cost.sh' ':!tools/games/run_derby.py' ':!tools/games/run_big_wave.py' ':!tools/kasane_contract/run_megademo_app_host.py' ':!tools/vmtest/prepare'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: derby-capture-${{ matrix.name }}-${{ env.HARNESS_HEAD }}
          path: source/artifacts/
          retention-days: 14
