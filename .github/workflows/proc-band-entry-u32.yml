name: Procedural band entry uint32 comparison
on:
  push:
    branches: [main]
    paths:
      - main/ui/kasane/ksn_shiki_frame.c
      - main/ui/kasane/ksn_shiki_frame.h
      - tools/kasane_contract/test_proc_band_entry_u32.c
      - .github/workflows/proc-band-entry-u32.yml
  pull_request:
    paths:
      - main/ui/kasane/ksn_shiki_frame.c
      - main/ui/kasane/ksn_shiki_frame.h
      - tools/kasane_contract/test_proc_band_entry_u32.c
      - .github/workflows/proc-band-entry-u32.yml
  workflow_dispatch:
permissions:
  contents: read
# New pushes replace a PR's older run; main runs finish so their caches are saved.
concurrency:
  group: proc-band-entry-u32-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        model: [x64, m32, sanitize]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_HEAD }}
          persist-credentials: false
      - name: Install 32-bit compiler libraries
        if: matrix.model == 'm32'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Check exact entry phase and existing pattern pixels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/entry
          flags=(-O2 -fstrict-aliasing)
          if [ '${{ matrix.model }}' = m32 ]; then flags+=(-m32); fi
          if [ '${{ matrix.model }}' = sanitize ]; then flags=(-O1 -g -fsanitize=address,undefined -fno-pie -no-pie); fi
          export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1
          # The frame and band renderer only: the float VM (and the old pattern
          # test's base-versus-candidate comparison, which ran it) went in Shiki
          # v2.0; test_proc_pattern_line.c now builds its frames from segments.
          common=(main/ui/kasane/ksn_shiki_surface.c)
          gcc -std=c11 -Wall -Wextra -Werror "${flags[@]}" -Imain/ui/kasane "${common[@]}" tools/kasane_contract/test_proc_band_entry_u32.c -lm -o artifacts/entry/boundary
          artifacts/entry/boundary | tee artifacts/entry/boundary.log
          if [ '${{ matrix.model }}' = m32 ]; then
            # x87 too: the renderer's pattern arithmetic is integer, so it must pass as SSE does.
            gcc -std=c11 -Wall -Wextra -Werror "${flags[@]}" -mfpmath=387 -Imain/ui/kasane "${common[@]}" main/ui/kasane/ksn_shiki_frame.c tools/kasane_contract/test_proc_pattern_line.c -lm -o artifacts/entry/pattern-x87
            artifacts/entry/pattern-x87 | tee artifacts/entry/pattern-x87.log
            flags+=(-msse2 -mfpmath=sse)
          fi
          gcc -std=c11 -Wall -Wextra -Werror "${flags[@]}" -Imain/ui/kasane "${common[@]}" main/ui/kasane/ksn_shiki_frame.c tools/kasane_contract/test_proc_pattern_line.c -lm -o artifacts/entry/pattern
          artifacts/entry/pattern | tee artifacts/entry/pattern.log
          file artifacts/entry/boundary | tee artifacts/entry/abi.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: proc-entry-u32-${{ matrix.model }}-${{ env.SOURCE_HEAD }}
          path: artifacts/entry/*.log
          retention-days: 14
  product:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [base, candidate]
    container:
      image: espressif/idf:v6.0.1
      options: --user 1001:1001
    env:
      IDF_COMPONENT_MANAGER: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.mode == 'base' && 'e0fe98a8c2a3de3b48c8d547c1ff3c8d99863267' || env.SOURCE_HEAD }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          path: ci-actions
          persist-credentials: false
      - uses: ./ci-actions/.github/actions/idf-ccache
        with:
          matrix: ${{ toJSON(matrix) }}
      - name: Build normal product with unchanged partition and security defaults
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          test "$(idf.py --version)" = 'ESP-IDF v6.0.1'
          idf.py -B build_entry -D SDKCONFIG=build_entry/sdkconfig build
          ccache -s || true
          git rev-parse HEAD > build_entry/source-head.txt
          grep -qx 'CONFIG_LOG_DEFAULT_LEVEL_INFO=y' build_entry/sdkconfig
          grep -qx 'POCKET_DERBY_COURSE_CACHE:BOOL=OFF' build_entry/CMakeCache.txt
          grep -qx 'POCKET_DERBY_PROJECT_BATCH:BOOL=OFF' build_entry/CMakeCache.txt
          python "$IDF_PATH/components/partition_table/gen_esp32part.py" -q --offset 0x8000 --flash-size 8MB partitions.csv build_entry/expected-partition.bin
          cmp build_entry/expected-partition.bin build_entry/partition_table/partition-table.bin
          python -c 'from pathlib import Path; e=Path("build_entry/cardputer_pocketjs.elf").read_bytes(); assert b"Application information:" in e; c=Path("build_entry/sdkconfig").read_text(); assert not any(k+"=y" in c for k in ("CONFIG_SECURE_BOOT", "CONFIG_SECURE_BOOT_V2_ENABLED", "CONFIG_SECURE_FLASH_ENC_ENABLED", "CONFIG_BOOTLOADER_APP_ANTI_ROLLBACK"))'
          sha256sum build_entry/cardputer_pocketjs.bin build_entry/cardputer_pocketjs.elf build_entry/bootloader/bootloader.bin build_entry/partition_table/partition-table.bin > build_entry/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proc-entry-u32-product-${{ matrix.mode }}-${{ env.SOURCE_HEAD }}
          path: |
            build_entry/cardputer_pocketjs.bin
            build_entry/cardputer_pocketjs.elf
            build_entry/cardputer_pocketjs.map
            build_entry/bootloader/bootloader.bin
            build_entry/partition_table/partition-table.bin
            build_entry/ota_data_initial.bin
            build_entry/flasher_args.json
            build_entry/flash_args
            build_entry/sdkconfig
            build_entry/CMakeCache.txt
            build_entry/source-head.txt
            build_entry/SHA256SUMS
          retention-days: 14

  # The DERBY device diagnostic built here (base vs candidate) patched the
  # game with a generator pinned before DERBY's integer race model; its
  # anchors no longer exist (const OV = [.5, ...), and the float VM it
  # measured went in Shiki v2.0. Retired with v2.0's removal of the VM.
