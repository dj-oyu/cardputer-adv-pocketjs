name: Procedural band entry uint32 comparison
on:
  pull_request:
    paths:
      - main/ui/kasane/ksn_procedural.c
      - main/ui/kasane/ksn_procedural.h
      - tools/kasane_contract/test_proc_band_entry_u32.c
      - .github/workflows/proc-band-entry-u32.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        model: [x64, m32, sanitize]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_HEAD }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: matrix.model == 'm32'
        with:
          ref: e0fe98a8c2a3de3b48c8d547c1ff3c8d99863267
          path: baseline-pattern
          persist-credentials: false
      - name: Install 32-bit compiler libraries
        if: matrix.model == 'm32'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Check exact entry phase and existing pattern pixels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/entry
          flags=(-O2 -fstrict-aliasing)
          if [ '${{ matrix.model }}' = m32 ]; then flags+=(-m32); fi
          if [ '${{ matrix.model }}' = sanitize ]; then flags=(-O1 -g -fsanitize=address,undefined -fno-pie -no-pie); fi
          export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1
          common=(main/ui/kasane/ksn_proc_analysis.c main/ui/kasane/ksn_proc_plan.c main/ui/kasane/ksn_procedural_surface.c)
          gcc -std=c11 -Wall -Wextra -Werror "${flags[@]}" -Imain/ui/kasane "${common[@]}" tools/kasane_contract/test_proc_band_entry_u32.c -lm -o artifacts/entry/boundary
          artifacts/entry/boundary | tee artifacts/entry/boundary.log
          if [ '${{ matrix.model }}' = m32 ]; then
            # Preserve x87 evidence before running the full float-width contract.
            # Accept a pass, or only the known single pre-existing threshold failure.
            output="$PWD/artifacts/entry"
            for mode in base candidate; do
              source=.; if [ "$mode" = base ]; then source=baseline-pattern; fi
              (cd "$source" && gcc -std=c11 -Wall -Wextra -Werror "${flags[@]}" -mfpmath=387 -Imain/ui/kasane "${common[@]}" main/ui/kasane/ksn_procedural.c tools/kasane_contract/test_proc_pattern_line.c -lm -o "$output/pattern-x87-$mode")
              status=0
              "$output/pattern-x87-$mode" > "$output/pattern-x87-$mode.log" 2>&1 || status=$?
              echo "$status" > "$output/pattern-x87-$mode.status.log"
              if [ "$status" = 1 ]; then
                test "$(wc -l < "$output/pattern-x87-$mode.log")" = 2
                grep -Fx 'FAIL tools/kasane_contract/test_proc_pattern_line.c:241 run(code,13,&frame)==KSN_PROC_DONE&&frame.count==2*(unsigned)flat[k][2]' "$output/pattern-x87-$mode.log"
                grep -Fx 'PATTERN LINE FAIL (1)' "$output/pattern-x87-$mode.log"
              else
                test "$status" = 0
              fi
            done
            cmp "$output/pattern-x87-base.status.log" "$output/pattern-x87-candidate.status.log"
            cmp "$output/pattern-x87-base.log" "$output/pattern-x87-candidate.log"
            # SSE avoids excess precision in the 1.02f comparison constant.
            flags+=(-msse2 -mfpmath=sse)
          fi
          gcc -std=c11 -Wall -Wextra -Werror "${flags[@]}" -Imain/ui/kasane "${common[@]}" main/ui/kasane/ksn_procedural.c tools/kasane_contract/test_proc_pattern_line.c -lm -o artifacts/entry/pattern
          artifacts/entry/pattern | tee artifacts/entry/pattern.log
          if [ '${{ matrix.model }}' = m32 ]; then
            (cd baseline-pattern && gcc -std=c11 -Wall -Wextra -Werror "${flags[@]}" -Imain/ui/kasane "${common[@]}" main/ui/kasane/ksn_procedural.c tools/kasane_contract/test_proc_pattern_line.c -lm -o ../artifacts/entry/pattern-base)
            artifacts/entry/pattern-base | tee artifacts/entry/pattern-base.log
          fi
          file artifacts/entry/boundary | tee artifacts/entry/abi.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: proc-entry-u32-${{ matrix.model }}-${{ env.SOURCE_HEAD }}
          path: artifacts/entry/*.log
          retention-days: 14
  product:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [base, candidate]
    container:
      image: espressif/idf:v6.0.1
      options: --user 1001:1001
    env:
      IDF_COMPONENT_MANAGER: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.mode == 'base' && 'e0fe98a8c2a3de3b48c8d547c1ff3c8d99863267' || env.SOURCE_HEAD }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build normal product with unchanged partition and security defaults
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          test "$(idf.py --version)" = 'ESP-IDF v6.0.1'
          idf.py -B build_entry -D SDKCONFIG=build_entry/sdkconfig build
          git rev-parse HEAD > build_entry/source-head.txt
          grep -qx 'CONFIG_LOG_DEFAULT_LEVEL_INFO=y' build_entry/sdkconfig
          grep -qx 'POCKET_DERBY_COURSE_CACHE:BOOL=OFF' build_entry/CMakeCache.txt
          grep -qx 'POCKET_DERBY_PROJECT_BATCH:BOOL=OFF' build_entry/CMakeCache.txt
          grep -qx 'POCKET_DERBY_RUNNER_AFFINE:BOOL=OFF' build_entry/CMakeCache.txt
          python "$IDF_PATH/components/partition_table/gen_esp32part.py" -q --offset 0x8000 --flash-size 8MB partitions.csv build_entry/expected-partition.bin
          cmp build_entry/expected-partition.bin build_entry/partition_table/partition-table.bin
          python -c 'from pathlib import Path; e=Path("build_entry/cardputer_pocketjs.elf").read_bytes(); assert b"Application information:" in e; c=Path("build_entry/sdkconfig").read_text(); assert not any(k+"=y" in c for k in ("CONFIG_SECURE_BOOT", "CONFIG_SECURE_BOOT_V2_ENABLED", "CONFIG_SECURE_FLASH_ENC_ENABLED", "CONFIG_BOOTLOADER_APP_ANTI_ROLLBACK"))'
          sha256sum build_entry/cardputer_pocketjs.bin build_entry/cardputer_pocketjs.elf build_entry/bootloader/bootloader.bin build_entry/partition_table/partition-table.bin > build_entry/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proc-entry-u32-product-${{ matrix.mode }}-${{ env.SOURCE_HEAD }}
          path: |
            build_entry/cardputer_pocketjs.bin
            build_entry/cardputer_pocketjs.elf
            build_entry/cardputer_pocketjs.map
            build_entry/bootloader/bootloader.bin
            build_entry/partition_table/partition-table.bin
            build_entry/ota_data_initial.bin
            build_entry/flasher_args.json
            build_entry/flash_args
            build_entry/sdkconfig
            build_entry/CMakeCache.txt
            build_entry/source-head.txt
            build_entry/SHA256SUMS
          retention-days: 14

  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [base, candidate]
        profile: [oval, straight]
    container:
      image: espressif/idf:v6.0.1
      options: --user 1001:1001
    env:
      IDF_COMPONENT_MANAGER: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5bf332368d6e793cd40a8a18a48b4da4ac270622
          path: tools-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.mode == 'base' && 'e0fe98a8c2a3de3b48c8d547c1ff3c8d99863267' || env.SOURCE_HEAD }}
          path: diagnostic-source
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare finite diagnostic in disposable checkout
        run: python3 -B tools-source/tools/games/prepare_derby_app_diag.py --checkout diagnostic-source --profile ${{ matrix.profile }}
      - name: Build with product settings and partition
        working-directory: diagnostic-source
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          test "$(idf.py --version)" = 'ESP-IDF v6.0.1'
          idf.py -B build_diag -D SDKCONFIG=build_diag/sdkconfig build
          git rev-parse HEAD > build_diag/source-head.txt
          grep -qx 'CONFIG_LOG_DEFAULT_LEVEL_INFO=y' build_diag/sdkconfig
          grep -qx 'POCKET_DERBY_COURSE_CACHE:BOOL=OFF' build_diag/CMakeCache.txt
          grep -qx 'POCKET_DERBY_PROJECT_BATCH:BOOL=OFF' build_diag/CMakeCache.txt
          python "$IDF_PATH/components/partition_table/gen_esp32part.py" -q --offset 0x8000 --flash-size 8MB partitions.csv build_diag/expected-partition.bin
          cmp build_diag/expected-partition.bin build_diag/partition_table/partition-table.bin
          python -c 'from pathlib import Path; e=Path("build_diag/cardputer_pocketjs.elf").read_bytes(); assert b"Application information:" in e and b"DERBY_APP_DIAG START workload=" in e and b"DERBY_APP_DIAG EXIT" in e; c=Path("build_diag/sdkconfig").read_text(); assert not any(k+"=y" in c for k in ("CONFIG_SECURE_BOOT", "CONFIG_SECURE_BOOT_V2_ENABLED", "CONFIG_SECURE_FLASH_ENC_ENABLED", "CONFIG_BOOTLOADER_APP_ANTI_ROLLBACK"))'
          cp diagnostic.json diagnostic.patch build_diag/
          sha256sum build_diag/cardputer_pocketjs.bin build_diag/cardputer_pocketjs.elf build_diag/bootloader/bootloader.bin build_diag/partition_table/partition-table.bin build_diag/diagnostic.json build_diag/diagnostic.patch > build_diag/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proc-entry-u32-diag-${{ matrix.mode }}-${{ matrix.profile }}-${{ env.SOURCE_HEAD }}
          path: |
            diagnostic-source/build_diag/cardputer_pocketjs.bin
            diagnostic-source/build_diag/cardputer_pocketjs.elf
            diagnostic-source/build_diag/cardputer_pocketjs.map
            diagnostic-source/build_diag/bootloader/bootloader.bin
            diagnostic-source/build_diag/partition_table/partition-table.bin
            diagnostic-source/build_diag/ota_data_initial.bin
            diagnostic-source/build_diag/flasher_args.json
            diagnostic-source/build_diag/flash_args
            diagnostic-source/build_diag/sdkconfig
            diagnostic-source/build_diag/CMakeCache.txt
            diagnostic-source/build_diag/source-head.txt
            diagnostic-source/build_diag/diagnostic.json
            diagnostic-source/build_diag/diagnostic.patch
            diagnostic-source/build_diag/SHA256SUMS
